# Temporary, for the writing-guide trial: builds and runs every case under
# tests/doc-trial/cases with the newest release of Whitefoot's main and
# uploads the diagnostics and outputs. Removed before the branch is ready.
name: doc-trial

on:
  push:
    paths:
      - 'tests/doc-trial/**'
      - '.github/workflows/doc-trial.yml'
  workflow_dispatch:

concurrency:
  group: doc-trial-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pin the newest Whitefoot main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/Ming-Research/Whitefoot/releases --paginate \
            --jq '.[] | select(.tag_name | test("^wf-[0-9a-f]{12}$")) | [.published_at, .tag_name] | @tsv' \
            | LC_ALL=C sort -r | head -n 1 | cut -f 2)
          test -n "$tag"
          echo "release = $tag" > tests/doc-trial/whitefoot.pin
          echo "newest release: $tag"

      - name: Toolchain
        run: make -C tests/doc-trial toolchain

      - name: Trial
        run: |
          make -C tests/doc-trial trial
          cat tests/doc-trial/build/results/summary.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: doc-trial-results
          path: |
            tests/doc-trial/build/results/**/compile.txt
            tests/doc-trial/build/results/**/stdout.txt
            tests/doc-trial/build/results/**/stderr.txt
            tests/doc-trial/build/results/**/status.txt
            tests/doc-trial/build/results/summary.md
            tests/doc-trial/whitefoot.pin
