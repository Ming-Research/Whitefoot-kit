# The kit's fast workflow (`ci.fast` of wf-agents.toml): what an agent's
# `run_tests` waits for while a work is under way. It runs only by hand, which
# only someone who may write to the repository can ask for. The engine of
# wf-agents always asks for it on main, so that this file as main holds it
# runs, with the commit to test, a value only its request knows, which the
# run's name holds, the tests to run and how long one test may run.
#
# A test is a target of the Makefile that its TESTS lists, as the full
# workflow (check.yml) names it. Each named test runs on each host the full
# workflow runs it on, by itself, through ci/run-tests.py; a name no test has
# is said in the log and reported as nothing, which the engine reads as a test
# that did not run. What became of each test is JUnit XML in the artifact
# `test-results`.
#
# The Linux tests run on the owner's own machine, the self-hosted runner
# 14900k, as the fast workflow of wf-agents does, because an agent waits for
# this workflow each time it asks for tests. The machine keeps the checkout
# and the newest Whitefoot release that the guide's checks downloaded, so a
# run downloads only a release it has not seen. The checkout leaves both in
# place (`clean: false`), and the step after it clears the rest of what the
# last run left. A job there has no root, and needs none: the tests need
# python3, make, curl and shasum, which the machine has.
#
# The tests check.yml runs on macOS, mk-check and ci-check, also run on
# GitHub's macos-15 here, since the owner's machine is Linux. That job starts
# only when one of them is named.
#
# It runs only by hand, never on a pull request: the repository is public,
# and a trigger by a pull request would run anyone's code on the owner's
# machine.
name: fast
run-name: fast ${{ inputs.call }}

on:
  workflow_dispatch:
    inputs:
      commit:
        description: The commit to check out and test, pushed to a branch of the repository already
        required: true
      call:
        description: A value only the request that asks for this run knows, which the run's name holds
        required: true
      tests:
        description: The tests to run, each name followed by a line break
        required: false
        default: ''
      test_stop:
        description: How long one test may run before it is stopped, in whole seconds; empty for no stop but the job's limit
        required: false
        default: ''

permissions:
  contents: read

# No concurrency group: each run is a request an agent waits for, which
# another request must not cancel.

jobs:
  # Every test check.yml runs on Linux. This job takes every name, so that one
  # no test has is said.
  linux:
    name: tests (14900k)
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 15
    env:
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/tests (14900k).xml
      TESTS_SUITE: tests (14900k)
      TESTS_STOP: ${{ inputs.test_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          clean: false
          # No later step pushes, so the token is not left in the checkout,
          # which the runner keeps.
          persist-credentials: false

      # The last run's build/ stays for the release the guide's checks
      # downloaded (build/docs/whitefoot/); the rest of build/ is what a run
      # writes and must not find there: the results, which run-tests.py adds
      # to, and mk-check's projects.
      - name: Clear what the last run left
        run: |
          git clean -ffdxq -e /build
          mkdir -p build/docs
          find build -mindepth 1 -maxdepth 1 ! -name docs -exec rm -rf {} +
          find build/docs -mindepth 1 -maxdepth 1 ! -name whitefoot -exec rm -rf {} +

      - name: Read the names
        env:
          GIVEN: ${{ inputs.tests }}
        run: |
          printf '%s\n' "$GIVEN" > "$RUNNER_TEMP/names"
          echo "Named here:"
          cat "$RUNNER_TEMP/names"

      # As check.yml picks it, by GitHub's API, with python3, which the
      # machine has; the release kept from an earlier run is reused, and any
      # older one is removed.
      - name: Pick the newest Whitefoot main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(python3 - <<'PY'
          import json, os, re, urllib.request
          found, page = [], 1
          while True:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/Ming-Research/Whitefoot/releases?per_page=100&page={page}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  releases = json.load(response)
              if not releases:
                  break
              found += [(r["published_at"] or "", r["tag_name"]) for r in releases
                        if re.fullmatch(r"wf-[0-9a-f]{12}", r["tag_name"])]
              page += 1
          print(max(found)[1] if found else "")
          PY
          )
          test -n "$tag"
          echo "KIT_DOWNLOAD_RELEASE=$tag" >> "$GITHUB_ENV"
          echo "newest release: $tag"
          mkdir -p build/docs/whitefoot
          find build/docs/whitefoot -mindepth 1 -maxdepth 1 ! -name "$tag" -exec rm -rf {} +

      - name: Pin the newest release for the guide's checks
        run: printf 'release = %s\n' "$KIT_DOWNLOAD_RELEASE" > docs/whitefoot.pin

      - name: Test
        run: ci/run-tests.py --names "$RUNNER_TEMP/names"

      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: ci/run-tests.py --end "$STATUS"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-linux
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The tests check.yml also runs on macOS, on GitHub's machine; it takes only
  # their names.
  macos:
    name: tests (macos-15)
    if: ${{ contains(inputs.tests, 'mk-check') || contains(inputs.tests, 'ci-check') }}
    runs-on: macos-15
    timeout-minutes: 15
    env:
      TESTS_JUNIT: ${{ github.workspace }}/build/test-results/tests (macos-15).xml
      TESTS_SUITE: tests (macos-15)
      TESTS_STOP: ${{ inputs.test_stop }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}

      - name: Read the names
        env:
          GIVEN: ${{ inputs.tests }}
        run: |
          printf '%s\n' "$GIVEN" > "$RUNNER_TEMP/names"
          printf '%s\n' mk-check ci-check > "$RUNNER_TEMP/here"
          awk '{ $1 = $1 } NR == FNR { here[$0]; next } $0 in here' "$RUNNER_TEMP/here" "$RUNNER_TEMP/names" \
            > "$RUNNER_TEMP/kept" || true
          mv "$RUNNER_TEMP/kept" "$RUNNER_TEMP/names"
          echo "Named here:"
          cat "$RUNNER_TEMP/names"

      - name: Test
        run: ci/run-tests.py --names "$RUNNER_TEMP/names"

      - name: Name the job's end in its results
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ job.status }}
        run: ci/run-tests.py --end "$STATUS"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: junit-macos
          path: build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # The JUnit of both jobs, in the one artifact the engine reads. It runs on
  # the owner's machine, which picks it up at once, and runs none of the
  # repository's code.
  results:
    needs: [linux, macos]
    if: ${{ !cancelled() }}
    runs-on: [self-hosted, 14900k]
    timeout-minutes: 5
    steps:
      - uses: actions/upload-artifact/merge@v4
        continue-on-error: true
        with:
          name: test-results
          pattern: junit-*
